services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD before starting Docker Compose}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD before starting Docker Compose}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$$NEO4J_USERNAME\" -p \"$$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  memory-agent:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      TEXT_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      AGENT_RUNTIME: pi
      SUBAGENT_RUNTIME_ENABLED: ${SUBAGENT_RUNTIME_ENABLED:-true}
      SUBAGENT_MAX_CONCURRENCY: ${SUBAGENT_MAX_CONCURRENCY:-3}
      SUBAGENT_MAX_TASKS_PER_CALL: ${SUBAGENT_MAX_TASKS_PER_CALL:-4}
      SUBAGENT_MAX_DEPTH: ${SUBAGENT_MAX_DEPTH:-1}
      DEEP_AGENT_RUNTIME_ENABLED: ${DEEP_AGENT_RUNTIME_ENABLED:-true}
      DEEP_AGENT_WORKER_MODE: ${DEEP_AGENT_WORKER_MODE:-external}
      DEEP_AGENT_MAX_CONCURRENCY: ${DEEP_AGENT_MAX_CONCURRENCY:-2}
      DEEP_AGENT_MAX_NODES: ${DEEP_AGENT_MAX_NODES:-16}
      DEEP_AGENT_MAX_REPLANS: ${DEEP_AGENT_MAX_REPLANS:-2}
      DEEP_AGENT_NODE_MAX_ATTEMPTS: ${DEEP_AGENT_NODE_MAX_ATTEMPTS:-2}
      DEEP_AGENT_LEASE_SECONDS: ${DEEP_AGENT_LEASE_SECONDS:-180}
      DEEP_AGENT_AUTO_REPLAN: ${DEEP_AGENT_AUTO_REPLAN:-true}
      SANDBOX_RUNTIME_ENABLED: ${SANDBOX_RUNTIME_ENABLED:-false}
      SANDBOX_PROVIDER: opensandbox
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-open-character-memory/sandbox:0.1.0}
      OPEN_SANDBOX_DOMAIN: ${OPEN_SANDBOX_DOMAIN:-opensandbox:8080}
      OPEN_SANDBOX_PROTOCOL: ${OPEN_SANDBOX_PROTOCOL:-http}
      OPEN_SANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY:-}
      SANDBOX_NETWORK_ALLOWED_HOSTS: ${SANDBOX_NETWORK_ALLOWED_HOSTS:-}
      SANDBOX_ALLOWED_PROGRAMS: ${SANDBOX_ALLOWED_PROGRAMS:-bash,python,python3,node,sh}
      ARTIFACT_ROOT: /app/data/artifacts
      GRAPH_STORE: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD before starting Docker Compose}
      NEO4J_DATABASE: neo4j
      NEO4J_REQUIRED: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting Docker Compose}
      MEMORY_TENANT_ID: ${MEMORY_TENANT_ID:-default}
      MEMORY_SERVICE_API_KEY: ${MEMORY_SERVICE_API_KEY:-}
      MEMORY_WORKER_POLL_MS: ${MEMORY_WORKER_POLL_MS:-750}
      MEMORY_JOB_MAX_ATTEMPTS: ${MEMORY_JOB_MAX_ATTEMPTS:-3}
      DATABASE_PATH: /app/data/memory-agent.db
    volumes:
      - memory_agent_data:/app/data
    restart: unless-stopped

  deep-agent-worker:
    build: .
    command: ["node", "scripts/deep-agent-worker.js"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TEXT_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      AGENT_RUNTIME: pi
      DATABASE_PATH: /app/data/memory-agent.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting Docker Compose}
      DEEP_AGENT_RUNTIME_ENABLED: ${DEEP_AGENT_RUNTIME_ENABLED:-true}
      DEEP_AGENT_WORKER_MODE: external
      DEEP_AGENT_WORKER_POLL_MS: ${DEEP_AGENT_WORKER_POLL_MS:-1000}
      DEEP_AGENT_MAX_CONCURRENCY: ${DEEP_AGENT_MAX_CONCURRENCY:-2}
      DEEP_AGENT_MAX_NODES: ${DEEP_AGENT_MAX_NODES:-16}
      DEEP_AGENT_MAX_REPLANS: ${DEEP_AGENT_MAX_REPLANS:-2}
      DEEP_AGENT_NODE_MAX_ATTEMPTS: ${DEEP_AGENT_NODE_MAX_ATTEMPTS:-2}
      DEEP_AGENT_LEASE_SECONDS: ${DEEP_AGENT_LEASE_SECONDS:-180}
      DEEP_AGENT_AUTO_REPLAN: ${DEEP_AGENT_AUTO_REPLAN:-true}
      SANDBOX_RUNTIME_ENABLED: ${SANDBOX_RUNTIME_ENABLED:-false}
      SANDBOX_PROVIDER: opensandbox
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-open-character-memory/sandbox:0.1.0}
      OPEN_SANDBOX_DOMAIN: ${OPEN_SANDBOX_DOMAIN:-opensandbox:8080}
      OPEN_SANDBOX_PROTOCOL: ${OPEN_SANDBOX_PROTOCOL:-http}
      OPEN_SANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY:-}
      SANDBOX_NETWORK_ALLOWED_HOSTS: ${SANDBOX_NETWORK_ALLOWED_HOSTS:-}
      SANDBOX_ALLOWED_PROGRAMS: ${SANDBOX_ALLOWED_PROGRAMS:-bash,python,python3,node,sh}
      ARTIFACT_ROOT: /app/data/artifacts
    volumes:
      - memory_agent_data:/app/data
    restart: unless-stopped

volumes:
  memory_agent_data:
  neo4j_data:
  neo4j_logs:
