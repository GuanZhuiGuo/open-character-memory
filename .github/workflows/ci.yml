name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test
        env:
          ARK_API_KEY: ""
      - run: npm run eval
      - run: npm run check:open-source
      - run: docker build -t memory-agent-studio:test .
